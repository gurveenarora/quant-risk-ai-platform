version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quant_backend_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=production-jwt-security-key
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: quant_redis_cache
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: quant_prometheus_metrics
    ports:
      - "9090:9090"
